name: Make Release

on:
  workflow_dispatch:

jobs:
  build_app:
    name: Build Android App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - name: Apply VERSION
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/apply_version.sh

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Create relese.jks
        run: mkdir ~/.android && echo "$release_jks" | base64 -d > ~/.android/release.jks
        env:
          release_jks: ${{ secrets.RELEASE_JKS }}
      - name: Create keystore.properties
        run: echo -e "storeFile=$(ls ~/.android/release.jks)\nstorePassword=${store_pass}\nkeyAlias=${key_alias}\nkeyPassword=${key_pass}\n" > keystore.properties
        env:
          store_pass: ${{ secrets.STORE_PASS }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_pass: ${{ secrets.KEY_PASS }}

      - name: Create debug keystore (fallback when no signing secrets)
        run: |
          ks=~/.config/.android/debug.keystore
          if [ ! -f "$ks" ]; then
            mkdir -p "$(dirname "$ks")"
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease
      - run: ./gradlew :app:signingReport

      - name: Refuse debug-signed APKs
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if echo "$certs" | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done

      - name: Checksum
        run: cd app/build/outputs/apk/release/ && sha256sum *.apk | tee $(ls *.apk).sha256

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/release/*.sha256

  build_server_mfc:
    name: Build server-mfc
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server-mfc
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Apply VERSION
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/apply_version.sh

      - uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-mfc-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-bin-mfc-

      - uses: microsoft/setup-msbuild@v2
      
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      
      - run: vcpkg integrate install
      
      - name: Install vcpkg packages
        shell: bash
        run: |
          for i in 1 2 3; do
            vcpkg install asio protobuf opus 'spdlog[wchar]' wil nlohmann-json && exit 0
            sleep 30
          done
          exit 1
      
      - run: msbuild /m /p:Configuration=Release,Platform=x64
      
      - name: Checksum
        run: cd x64/Release/ && sha256sum *.exe | tee $(ls *.exe).sha256
        shell: bash
      
      - uses: actions/upload-artifact@v4
        with:
          name: server-mfc
          path: |
            server-mfc/x64/Release/*.exe
            server-mfc/x64/Release/*.sha256

  build_server_core:
    name: Build server-core
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            vcpkg_triplet: x64-windows-static-md
            cmake_preset: windows-Release
            platform: windows
          - os: ubuntu-22.04
            vcpkg_triplet: x64-linux
            cmake_preset: linux-Release
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server-core
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Apply VERSION
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash scripts/apply_version.sh

      - uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-core-${{ matrix.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-bin-core-${{ matrix.os }}-
      
      - name: Install Linux Deps
        run: sudo apt update && sudo apt install -y libpipewire-0.3-dev
        if: ${{ matrix.os == 'ubuntu-22.04' }}
      
      - uses: lukka/get-cmake@latest
      
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: e456309491fd875487bf02b8a0dca76c1b1b00cc
      
      - run: vcpkg integrate install
      
      - name: Install vcpkg packages
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows ]; then extra="spdlog[wchar] wil"; else extra=spdlog; fi
          # github.com returns 503 now and then when vcpkg fetches port patches
          for i in 1 2 3; do
            vcpkg install asio protobuf cxxopts opus $extra && exit 0
            sleep 30
          done
          exit 1
      
      - uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/server-core/CMakeLists.txt
          configurePreset: ${{ matrix.cmake_preset }}
          buildPreset: ${{ matrix.cmake_preset }}
      
      - name: Pack
        run: bash pack.sh ${{ matrix.platform }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: server-core-${{ matrix.platform }}
          path: |
            server-core/out/install/*.sha256
            server-core/out/install/*.tar.gz
            server-core/out/install/*.zip

  create_release:
    name: Create Release
    needs: [build_app, build_server_mfc, build_server_core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - run: chmod +x ./scripts/get_version.sh
      
      - uses: actions/download-artifact@v4
        with:
          path: release_bin
      
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          range=${prev:+$prev..HEAD}
          git log --no-merges --pretty='- %s' ${range:--30} > notes
      
      - name: Create Github Release
        run: |
          version=$(bash ./scripts/get_version.sh -n)
          gh release create "v$version" -d -F notes -t "v$version" release_bin/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
